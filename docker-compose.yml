services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-manager-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
